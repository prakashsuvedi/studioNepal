name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is missing in GitHub repository secrets! Go to Settings -> Secrets and variables -> Actions and add HF_TOKEN."
            exit 1
          fi

          git config --global user.name "prakashsuvedi"
          git config --global user.email "prakashsuvedi.backup@gmail.com"
          git config --global http.postBuffer 524288000

          # Mask HF_TOKEN in logs
          echo "::add-mask::$HF_TOKEN"

          # Create a clean orphan branch without legacy binary history
          git checkout --orphan deploy-clean
          
          # Remove any binary media files from git staging
          git rm -rf --cached "data/storage/*.mp3" "data/storage/*.mp4" "data/storage/*.wav" "data/storage/*.png" "data/storage/*.jpg" 2>/dev/null || true
          git rm -rf --cached "*.mp3" "*.mp4" "*.wav" 2>/dev/null || true
          find data/storage -type f \( -name "*.mp3" -o -name "*.mp4" -o -name "*.wav" \) -delete 2>/dev/null || true

          git add .
          git commit -m "Deploy NepalAI Studio Clean Codebase" || true

          git remote remove hf 2>/dev/null || true
          git remote add hf https://prakashsuvedi:${HF_TOKEN}@huggingface.co/spaces/prakashsuvedi/nepalai-studio
          
          echo "Pushing clean codebase to Hugging Face Space..."
          git push hf deploy-clean:refs/heads/main --force

