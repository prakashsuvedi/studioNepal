name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is missing in GitHub repository secrets! Go to Settings -> Secrets and variables -> Actions and add HF_TOKEN."
            exit 1
          fi

          git config --global user.name "prakashsuvedi"
          git config --global user.email "prakashsuvedi.backup@gmail.com"
          git config --global http.postBuffer 524288000

          # Mask HF_TOKEN in logs
          echo "::add-mask::$HF_TOKEN"

          git remote remove hf 2>/dev/null || true
          git remote add hf https://prakashsuvedi:${HF_TOKEN}@huggingface.co/spaces/prakashsuvedi/nepalai-studio
          
          echo "Pushing code to Hugging Face Space..."
          git push hf HEAD:refs/heads/main --force

