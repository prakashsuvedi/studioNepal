name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    name: Push Codebase to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Sync and Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HF_ACCESS_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error title=Missing HF_TOKEN Secret::GitHub Secret 'HF_TOKEN' is missing or empty! Please navigate to GitHub Repo -> Settings -> Secrets and variables -> Actions, create a repository secret named 'HF_TOKEN', and set its value to your Hugging Face Access Token with WRITE permissions (https://huggingface.co/settings/tokens)."
            exit 1
          fi

          # Mask token in all future command logs
          echo "::add-mask::$HF_TOKEN"

          echo "Configuring Git global identity..."
          git config --global user.name "prakashsuvedi"
          git config --global user.email "prakashsuvedi.backup@gmail.com"
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

          echo "Preparing clean branch for Hugging Face deployment..."
          git checkout -B deploy-hf-sync

          # Clean and sanitize local JSON database so it stays under 100KB
          node -e '
            const fs = require("fs");
            if (fs.existsSync("data/nepalai_db.json")) {
              try {
                const db = JSON.parse(fs.readFileSync("data/nepalai_db.json", "utf-8"));
                if (db.generationLogs) {
                  db.generationLogs = db.generationLogs.map(log => {
                    if (log.resultUrl && log.resultUrl.startsWith("data:")) {
                      log.resultUrl = "[base64_media_truncated]";
                    }
                    return log;
                  }).slice(-20);
                }
                fs.writeFileSync("data/nepalai_db.json", JSON.stringify(db, null, 2));
                console.log("Sanitized data/nepalai_db.json. Current size:", fs.statSync("data/nepalai_db.json").size, "bytes");
              } catch(e) {
                console.warn("Could not parse data/nepalai_db.json, recreating lean seed:", e);
              }
            }
          '

          # Ensure runtime binaries and generated media are untracked
          git rm -rf --cached "data/storage/*.mp3" "data/storage/*.mp4" "data/storage/*.wav" "data/storage/*.png" "data/storage/*.jpg" 2>/dev/null || true
          git rm -rf --cached "*.mp3" "*.mp4" "*.wav" "*.png" "*.jpg" 2>/dev/null || true
          git rm -rf --cached "chat_*.txt" "full_chat_history.txt" 2>/dev/null || true

          # Remove any unexpected large file (> 8MB) from staging to prevent HF rejection
          find . -maxdepth 3 -type f -size +8M ! -path "./.git/*" -exec rm -f {} + 2>/dev/null || true

          git add -A
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Deploy NepalAI Studio to Hugging Face Spaces" || true
          fi

          echo "Configuring Hugging Face remote repository..."
          git remote remove hf 2>/dev/null || true
          git remote add hf https://prakashsuvedi:${HF_TOKEN}@huggingface.co/spaces/prakashsuvedi/nepalai-studio

          echo "Pushing code to Hugging Face Space (prakashsuvedi/nepalai-studio)..."
          git push --force hf deploy-hf-sync:main

