version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: nepalai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      target: web
    container_name: nepalai-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  render-worker:
    build:
      context: .
      target: render-worker
    container_name: nepalai-render-worker
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - FFMPEG_HWACCEL=libx264
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 2048M
    restart: unless-stopped

volumes:
  redis_data:
