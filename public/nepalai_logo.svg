<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="540" height="160">
  <defs>
    <!-- Node Glow Filter for Constellation Stars -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep Glossy Orb Radial Gradient -->
    <radialGradient id="orbGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a3b8f"/>
      <stop offset="40%" stop-color="#121a52"/>
      <stop offset="75%" stop-color="#070b28"/>
      <stop offset="100%" stop-color="#020412"/>
    </radialGradient>

    <!-- Metallic Gold Mountain Facets -->
    <linearGradient id="goldFacetMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe875"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="goldFacetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="goldFacetShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- 3D Cyan Swoosh Curved Accent -->
    <linearGradient id="cyanSwooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Text Typography Gradients -->
    <!-- High-Contrast Nepal Gradient: Crisp White / Ice-Blue for Dark Backgrounds -->
    <linearGradient id="nepalTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- AI Cyan Vibrant Gradient -->
    <linearGradient id="aiTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Studio Rich Gold Gradient -->
    <linearGradient id="studioTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Text Shadow Filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Whole Transparent Logo Group -->
  <g>
    <!-- EMBLEM ORB GROUP -->
    <g transform="translate(10, 10)">
      <!-- Main Orb Sphere Base -->
      <circle cx="70" cy="70" r="64" fill="url(#orbGradient)" stroke="#2563eb" stroke-width="2" />
      
      <!-- Orb Outer Rim Glow -->
      <circle cx="70" cy="70" r="63" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6" />

      <!-- Constellation AI Connecting Network (Top Left of Orb) -->
      <g opacity="0.95" filter="url(#nodeGlow)">
        <!-- Lines -->
        <line x1="28" y1="52" x2="44" y2="34" stroke="#38bdf8" stroke-width="2" />
        <line x1="44" y1="34" x2="68" y2="24" stroke="#38bdf8" stroke-width="2" />
        <line x1="28" y1="52" x2="52" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" />
        <line x1="44" y1="34" x2="52" y2="50" stroke="#38bdf8" stroke-width="1.5" />

        <!-- Nodes / Glowing Stars -->
        <circle cx="28" cy="52" r="4" fill="#38bdf8" />
        <circle cx="44" cy="34" r="3.5" fill="#a5f3fc" />
        <circle cx="68" cy="24" r="5" fill="#fef08a" stroke="#f59e0b" stroke-width="1" />
        <circle cx="52" cy="50" r="3" fill="#38bdf8" />
      </g>

      <!-- 3D Metallic Golden Mountains -->
      <g>
        <!-- Background Far Left Peak Shadow -->
        <polygon points="35,92 56,58 76,92" fill="url(#goldFacetShadow)" />
        
        <!-- Secondary Mid Peak -->
        <polygon points="48,94 74,42 96,94" fill="url(#goldFacetShadow)" />
        <polygon points="74,42 96,94 84,94" fill="url(#goldFacetMain)" />

        <!-- Main Majestic Peak - Light Facet (Left) -->
        <polygon points="55,98 88,32 94,98" fill="url(#goldFacetHighlight)" />
        
        <!-- Main Majestic Peak - Front Main Facet (Center-Right) -->
        <polygon points="88,32 124,98 94,98" fill="url(#goldFacetMain)" />
        
        <!-- Main Peak Right Edge Shadow Facet -->
        <polygon points="88,32 124,98 128,82 108,50" fill="url(#goldFacetShadow)" />

        <!-- Foreground Right Smaller Peak -->
        <polygon points="96,98 126,56 138,98" fill="url(#goldFacetMain)" />
        <polygon points="126,56 138,98 132,98" fill="url(#goldFacetHighlight)" />
      </g>

      <!-- Smooth Curved Bottom 3D Blue/Cyan Swoosh Crescent -->
      <path d="M 10,80 C 20,128 88,142 136,90 C 104,130 36,122 18,84 Z" fill="url(#cyanSwooshGrad)" />
      <!-- Swoosh Inner Highlight -->
      <path d="M 22,92 C 45,124 94,124 126,94 C 100,118 48,118 28,94 Z" fill="#7dd3fc" opacity="0.6" />
    </g>

    <!-- TYPOGRAPHY GROUP: NepalAI studio -->
    <g transform="translate(155, 15)" filter="url(#textGlow)">
      <!-- Nepal (Crisp White/Ice Blue Gradient - 100% Readable on Dark Surfaces) -->
      <text 
        x="0" 
        y="68" 
        font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
        font-weight="900" 
        font-size="64" 
        fill="url(#nepalTextGrad)" 
        letter-spacing="-1.5"
      >Nepal</text>

      <!-- AI (Vibrant Electric Cyan) -->
      <text 
        x="185" 
        y="68" 
        font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
        font-weight="900" 
        font-size="64" 
        fill="url(#aiTextGrad)" 
        letter-spacing="-1"
      >AI</text>
      
      <!-- studio (Rich Gold / Warm Bronze) -->
      <text 
        x="125" 
        y="114" 
        font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
        font-weight="700" 
        font-size="40" 
        fill="url(#studioTextGrad)" 
        letter-spacing="0"
      >studio</text>
    </g>

  </g>
</svg>
